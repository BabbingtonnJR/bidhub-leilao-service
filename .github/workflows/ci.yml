# Testes unitários e de arquitetura a cada push/PR; na main, publica a imagem no Docker Hub.
# Segredos do repositório: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (token de acesso do Docker Hub).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testes unitários + testes de arquitetura
        run: npm test

  imagem:
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TEM_SEGREDOS: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.TEM_SEGREDOS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: env.TEM_SEGREDOS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bidhub-leilao-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bidhub-leilao-service:sha-${{ github.sha }}
      - if: env.TEM_SEGREDOS != 'true'
        run: echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN não configurados; imagem não publicada."
